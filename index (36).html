<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Tshake · DJ L4N × MC Budzak | DJ & Karaoke Entertainment Bandung</title>
<meta name="description" content="DJ & Karaoke Entertainment untuk kampus, sekolah, dan event. Breakbeat, EDM, Sing-A-Long. Booking online.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080a;--panel:#101216;--line:#23262d;--ink:#eceef2;--mute:#8b919c;--acc:#c6ff3d;--r:14px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:300 1rem/1.7 Poppins,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1}
a{color:inherit}:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 1.25rem}
section{padding:5rem 0;border-top:1px solid var(--line)}
.mono{font-family:"Space Mono",monospace;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:2.4rem}
.sh .mono{display:block;margin-bottom:.7rem}
h2{font-size:clamp(2.3rem,5.5vw,3.8rem);letter-spacing:.01em}
.sub{color:var(--mute);max-width:520px;margin-top:.7rem}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border-radius:4px;padding:.75rem 1.6rem;font:500 .85rem "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid transparent;text-align:center}
.pri{background:var(--acc);color:#0b0c0e}.pri:hover{filter:brightness(1.1)}
.gho{border-color:#3a3e47;color:var(--ink);background:transparent}.gho:hover{border-color:var(--acc);color:var(--acc)}
nav{position:sticky;top:0;z-index:30;background:#07080ae6;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:64px}
nav b{font:400 1.5rem Anton;letter-spacing:.08em;display:flex;align-items:center;gap:.6rem}
nav b::before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 2px,var(--acc) 3px)}
nav div{display:flex;gap:1.7rem;align-items:center}
nav div a:not(.btn){color:var(--mute);text-decoration:none;font:400 .72rem "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
nav div a:not(.btn):hover{color:var(--acc)}nav .btn{padding:.45rem 1.1rem}
@media(max-width:820px){nav div a:not(.btn){display:none}}
.hero{padding:3rem 0 0;overflow:hidden;background:radial-gradient(ellipse at 78% 45%,#20241a 0,transparent 62%)}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:1rem;align-items:end}
.ht{padding-bottom:3.5rem;align-self:center}
.ht .mono{margin-bottom:1rem}
.ht h1{font-size:clamp(4.2rem,11vw,8.6rem);margin-bottom:1.2rem;letter-spacing:.01em}
.ht h1 em{font-style:normal;color:var(--acc)}
.lead{color:#cfd2d8;max-width:520px;margin-bottom:1.8rem}
.btns{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:2.4rem}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;border-top:1px solid var(--line)}
.stats div{padding:1rem 2rem 0 0;margin-right:2rem;border-right:1px solid var(--line)}.stats div:last-child{border:0}
.stats b{display:block;font:400 2rem/1.1 Anton}.stats span{color:var(--mute);font-size:.8rem}
.hp{position:relative;min-height:520px;display:flex;align-items:flex-end;justify-content:center}
.vn{position:absolute;width:min(440px,92%);aspect-ratio:1;border-radius:50%;bottom:90px;left:50%;margin-left:calc(min(440px,92%)/-2);background:repeating-radial-gradient(circle,#0c0d10 0 2px,#16181d 3px 4px);box-shadow:0 0 0 1px #2b2f37,0 30px 80px #000;animation:sp 9s linear infinite}
.vn::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,#fff0,#ffffff14 12%,#fff0 25%,#fff0 50%,#ffffff12 62%,#fff0 75%)}
.vn::after{content:"TSHAKE";position:absolute;inset:36%;border-radius:50%;background:var(--acc);color:#0b0c0e;display:grid;place-items:center;font:400 1rem Anton;letter-spacing:.1em;box-shadow:0 0 0 6px #0c0d10}
@keyframes sp{to{transform:rotate(360deg)}}
.hp img{position:relative;max-height:560px;max-width:100%;object-fit:contain;filter:drop-shadow(0 12px 40px #000c)}
@media(max-width:860px){.hg{grid-template-columns:1fr}.hp{order:-1;min-height:380px}.hp img{max-height:400px}.vn{bottom:50px}}
.eq{display:flex;align-items:flex-end;gap:4px;height:64px;padding:0 1.25rem;max-width:1160px;margin:0 auto}
.eq i{flex:1;background:var(--acc);opacity:.85;height:var(--h);border-radius:2px 2px 0 0;transform-origin:bottom;animation:eq 1.1s ease-in-out var(--d) infinite alternate}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.mq{background:var(--acc);color:#0b0c0e;overflow:hidden;white-space:nowrap;padding:.65rem 0}
.mq span{display:inline-block;font:400 1.2rem Anton;letter-spacing:.06em;animation:mv 32s linear infinite}
@keyframes mv{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mq span,.vn,.eq i{animation:none}html{scroll-behavior:auto}}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:3rem}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.two p{color:#cfd2d8;margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}
.chip{border:1px solid var(--line);padding:.2rem .9rem;font:400 .75rem "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;border-radius:3px}
.fact{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);padding:1.3rem 1.5rem;margin-bottom:1rem}
.fact h3{font-size:1.35rem;margin-bottom:.4rem;letter-spacing:.03em}.fact p{margin:0;font-size:.92rem;color:var(--mute)}
.ev{border-bottom:1px solid var(--line)}.ev:first-of-type{border-top:1px solid var(--line)}
.ev summary{list-style:none;display:grid;grid-template-columns:96px 1fr auto 24px;gap:1.4rem;align-items:center;padding:1.3rem .5rem;cursor:pointer}
.ev summary::-webkit-details-marker{display:none}.ev summary:hover{background:#ffffff06}
.dt b{display:block;font:400 2.4rem/1 Anton;color:var(--acc)}.dt span{font:400 .68rem "Space Mono",monospace;letter-spacing:.1em;color:var(--mute)}
.nm h3{font-size:clamp(1.4rem,3.2vw,2.1rem);letter-spacing:.02em}.nm small{color:var(--mute);font-family:"Space Mono",monospace;font-size:.74rem;letter-spacing:.06em}
.aud{border:1px solid var(--acc);color:var(--acc);border-radius:3px;padding:.15rem .8rem;font:400 .74rem "Space Mono",monospace;white-space:nowrap}
.cv{width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:.2s}
.ev[open] .cv{transform:rotate(-135deg);border-color:var(--acc)}
.eb{padding:.2rem .5rem 1.8rem 120px}.eb>p{color:#cfd2d8;max-width:720px;margin-bottom:1.2rem}
@media(max-width:700px){.ev summary{grid-template-columns:64px 1fr 20px}.ev .aud{display:none}.eb{padding-left:.5rem}.dt b{font-size:1.8rem}}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.ph{aspect-ratio:1;border-radius:8px;background:#0f1113 center/cover no-repeat;border:0;padding:0;cursor:zoom-in}
.ph:first-child{grid-column:span 2;grid-row:span 2}.ph:hover{filter:brightness(1.15)}
.noph{border:1px dashed var(--line);border-radius:8px;padding:1.4rem;text-align:center;color:var(--mute);font-size:.88rem}
@media(max-width:700px){.gal{grid-template-columns:repeat(2,1fr)}}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.8rem;display:flex;flex-direction:column;gap:.7rem;position:relative}
.card.best{border-color:var(--acc);background:#14180f}
.tag{position:absolute;top:-.75rem;left:1.5rem;background:var(--acc);color:#0b0c0e;font:700 .66rem "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .8rem;border-radius:3px}
.card h3{font-size:1.8rem;letter-spacing:.03em}.dur{color:var(--mute);font:400 .74rem "Space Mono",monospace}
.card ul{list-style:none;padding:0;flex:1;font-size:.92rem;color:#cfd2d8}
.card li{padding:.25rem 0 .25rem 1.3rem;position:relative}
.card li::before{content:"";position:absolute;left:0;top:.8rem;width:.55rem;height:.55rem;background:var(--acc);transform:rotate(45deg)}
.price{font:400 2.8rem/1 Anton}.note{margin-top:1.3rem;color:var(--mute);font-size:.86rem}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}@media(max-width:820px){.pg{grid-template-columns:1fr}}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:1rem;margin-bottom:1.1rem;color:#cfd2d8}
.steps li::before{content:counter(s);flex:none;width:2rem;height:2rem;border-radius:3px;background:var(--acc);color:#0b0c0e;font:700 .85rem "Space Mono",monospace;display:grid;place-items:center}
.pay{display:grid;grid-template-columns:auto 1fr;gap:1.3rem;align-items:center}@media(max-width:520px){.pay{grid-template-columns:1fr}}
.qr{width:190px;max-width:100%;border-radius:10px;background:#fff;padding:8px;cursor:zoom-in;border:0}.qr img{width:100%;display:block}
.acct small{color:var(--mute);display:block}.acct .no{font:400 2rem Anton;letter-spacing:.05em;margin:.1rem 0 .4rem;display:block}
.cp{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;padding:.3rem 1rem;font:400 .75rem "Space Mono",monospace}.cp:hover{border-color:var(--acc);color:var(--acc)}
.rid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.rid div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.3rem;font-size:.92rem;color:#cfd2d8}.rid b{color:var(--ink);font-weight:600}
.rh{font-size:1.4rem;margin:2rem 0 1rem;letter-spacing:.04em;color:var(--acc)}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-bottom:2rem}
.cl a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem 1.4rem;text-decoration:none;word-break:break-all}
.cl a:hover{border-color:var(--acc)}.cl small{color:var(--mute);display:block;font:400 .7rem "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase}.cl b{font-weight:500}
footer{padding:2rem 0 5rem;color:var(--mute);font:400 .72rem "Space Mono",monospace;letter-spacing:.08em;text-align:center;border-top:1px solid var(--line);text-transform:uppercase}
#lb{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:80;padding:1rem}
#lb.on{display:grid}#lb img{max-width:100%;max-height:90vh;border-radius:8px}
#lb button{position:absolute;top:50%;background:#000a;color:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:1.4rem}
#lb .x{top:1rem;right:1rem}#lb .pv{left:1rem}#lb .nx{right:1rem}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--acc);color:#0b0c0e;padding:.5rem 1.2rem;border-radius:4px;z-index:90;display:none;font-weight:500}
#bk{position:fixed;inset:0;background:#000d;display:none;z-index:85;overflow:auto;padding:1rem}#bk.on{display:block}
#bf{max-width:520px;margin:2rem auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;display:grid;gap:.8rem}
#bf label{display:grid;gap:.25rem;font:400 .72rem "Space Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#bf input,#bf select,#bf textarea{background:#0b0c0e;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:.6rem .8rem;font:300 1rem Poppins,sans-serif;text-transform:none;letter-spacing:0;width:100%}
#bs{color:var(--acc);font-weight:500}#be{color:#ff6b6b;font-size:.88rem}.fwa{position:fixed;right:16px;bottom:16px;z-index:50;box-shadow:0 6px 24px #000a}
</style>
</head>
<body>
<nav><div class="wrap"><b>TSHAKE</b><div><a href="#about">Tentang</a><a href="#events">Event</a><a href="#rate">Paket</a><a href="#bayar">Pembayaran</a><a href="#rider">Rider</a><a class="btn pri" href="#" data-pick="1">Booking</a></div></div></nav>
<main id="app"></main>
<div id="lb"><button class="x" aria-label="Tutup">×</button><button class="pv" aria-label="Sebelumnya">‹</button><img alt=""><button class="nx" aria-label="Berikutnya">›</button></div>
<div id="toast"></div>
<div id="bk"><div id="bf"><h3 style="font-size:2rem">Checkout</h3>
<label>Paket<select id="bp"></select></label><label>Tanggal event<input id="bd" type="date"></label>
<label>Nama<input id="bn"></label><label>No. WhatsApp<input id="bw" inputmode="tel" placeholder="08xxxxxxxxxx"></label>
<label>Lokasi acara<input id="bl"></label><label>Catatan<textarea id="bt" rows="2"></textarea></label>
<div id="bs"></div><div id="be"></div><button class="btn pri" id="bgo">Pesan sekarang</button><button class="btn gho" id="bx">Tutup</button><div id="br"></div></div></div>
<a class="btn pri wa fwa" href="#">Chat WA</a>
<script src="defaults.js"></script>
<script>
let D=structuredClone(DEF),lbList=[],lbI=0;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};
const MON=["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGU","SEP","OKT","NOV","DES"];
const dt=e=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(e.date||"");return m?`<b>${+m[3]}</b><span>${MON[m[2]-1]} ${m[1]}</span>`:`<b>—</b><span>EVENT</span>`};
function render(){
 const P=D.profile,Y=D.pay,wa="https://wa.me/"+P.wa+"?text="+encodeURIComponent("Halo DJ Tshake, saya mau tanya booking untuk event...");
 const evs=D.events.map((e,i)=>({e,i})).sort((a,b)=>(b.e.date||"").localeCompare(a.e.date||""));
 const ev=evs.map(({e,i},n)=>`<details class="ev"${n==0?" open":""}><summary><div class="dt">${dt(e)}</div><div class="nm"><h3>${esc(e.name)}</h3>${e.venue?`<small>${esc(e.venue)}</small>`:""}</div>${e.audience?`<span class="aud">${esc(e.audience)}</span>`:"<span></span>"}<i class="cv"></i></summary>
  <div class="eb"><p>${esc(e.highlight)}</p>${(e.photos||[]).length?`<div class="gal">${e.photos.map((p,k)=>`<button class="ph" data-lb="${i}:${k}" style="background-image:url('${esc(p)}')" aria-label="Foto ${k+1} ${esc(e.name)}"></button>`).join("")}</div>`:`<div class="noph">Dokumentasi segera hadir.</div>`}</div></details>`).join("");
 const rt=D.rates.map((r,i)=>`<div class="card${r.best?" best":""}">${r.tag?`<span class="tag">${esc(r.tag)}</span>`:""}
  <h3>${esc(r.name)}</h3><div class="dur">${esc(r.who)} · ${esc(r.dur)}</div><ul>${r.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <div class="price">${esc(r.price)}</div><button class="btn ${r.best?"pri":"gho"}" data-pick="${i}">Pilih &amp; checkout</button></div>`).join("");
 const hasPay=Y.qris||Y.no,eq=Array.from({length:40},(_,i)=>`<i style="--d:${(i*37%11)/10}s;--h:${30+i*53%70}%"></i>`).join("");
 $("#app").innerHTML=`
 <header class="hero"><div class="wrap hg">
  <div class="ht"><p class="mono">DJ · MC · Karaoke Entertainment — Bandung</p><h1>DJ <em>Tshake</em></h1>
   <p class="lead">DJ L4N (HEY LANNN) dan MC Budzak membangun energi dari pembukaan hingga puncak acara. Setlist bersih, aman untuk kampus, sekolah, dan event resmi.</p>
   <div class="btns"><a class="btn pri wa" href="#">Booking via WhatsApp</a><a class="btn gho" href="#events">Lihat rekam jejak</a></div>
   <div class="stats">${P.stats.map(s=>`<div><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join("")}</div></div>
  <div class="hp"><div class="vn" aria-hidden="true"></div><img src="${esc(P.photo||"foto/lana.png")}" alt="DJ L4N" onerror="this.style.display='none'"></div>
 </div><div class="eq" aria-hidden="true">${eq}</div></header>
 <div class="mq" aria-hidden="true"><span>${"BREAKBEAT ✦ EDM ✦ SING-A-LONG ✦ SONG REQUEST ✦ LAGU VIRAL ✦ ".repeat(10)}</span></div>
 <section id="about"><div class="wrap"><div class="sh"><div><span class="mono">01 / Profil</span><h2>Tentang</h2></div></div><div class="two">
  <div><p>DJ L4N berbasis di Bandung dan dikenal menyatukan massa lewat Breakbeat, EDM, dan Sing-A-Long. Panggungnya dari festival kota sampai acara eksklusif fakultas.</p>
  <p>Bersama MC Budzak (Rakha), tampil sebagai duet interaktif agar audiens tetap bersemangat dari awal sampai akhir. Tanpa lagu toxic, aman untuk pihak terkait.</p>
  <div class="chips">${["Breakbeat","EDM","Sing-A-Long","MixTape","Lagu Viral"].map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>
  <div><div class="fact"><h3>Pro Gear</h3><p>Numark Mixtrack Pro 3 milik sendiri. Bisa juga memakai alat DJ dari panitia.</p></div>
  <div class="fact"><h3>Technical Setup</h3><p>Koneksi RCA to XLR untuk suara jernih dan sesuai standar soundsystem profesional.</p></div>
  <div class="fact"><h3>Song Request</h3><p>Audiens ikut menentukan musik, sehingga setiap penampilan terasa relevan.</p></div></div></div></div></section>
 <section id="events"><div class="wrap"><div class="sh"><div><span class="mono">02 / Rekam jejak · ${D.events.length} event</span><h2>Event yang pernah dihadiri</h2><p class="sub">Daftar panggung dari festival kota sampai acara fakultas. Klik baris untuk melihat detail dan dokumentasi.</p></div></div><div>${ev}</div></div></section>
 <section id="rate"><div class="wrap"><div class="sh"><div><span class="mono">03 / Penawaran</span><h2>Paket &amp; harga</h2><p class="sub">Pilih sesuai kebutuhan acara. Untuk event full day, harga disesuaikan.</p></div></div><div class="rates">${rt}</div>
  <p class="note">Harga belum termasuk rider. Basic dan Duo maksimal 40 menit. Luar kota: transportasi dan penginapan ditanggung panitia.</p></div></section>
 <section id="bayar"><div class="wrap"><div class="sh"><div><span class="mono">04 / Transaksi</span><h2>Pembayaran</h2><p class="sub">Alur booking dan informasi pembayaran.</p></div></div>
  <div class="pg"><div class="fact"><h3>Cara booking</h3><ol class="steps" style="margin-top:1rem"><li><span>Pilih paket dan tanggal, lalu isi checkout.</span></li><li><span>Simpan kode pesanan dan lakukan pembayaran.</span></li><li><span>Kirim bukti bayar via WhatsApp untuk konfirmasi.</span></li></ol><p>${esc(Y.note)}</p></div>
  <div class="fact"><h3>Transfer</h3>${hasPay?`<div class="pay" style="margin-top:1rem">${Y.qris?`<button class="qr" data-qr="1" aria-label="Perbesar QRIS"><img src="${esc(Y.qris)}" alt="QRIS pembayaran"></button>`:""}
   <div class="acct">${Y.no?`<small>${esc(Y.bank)}${Y.name?" a.n. "+esc(Y.name):""}</small><span class="no">${esc(Y.no)}</span><button class="cp" data-copy="${esc(Y.no)}">Salin nomor</button>`:`<small>Scan QRIS di samping</small>`}</div></div>`:`<p style="margin-top:.8rem">Detail pembayaran dikirim lewat WhatsApp saat booking.</p>`}</div></div></div></section>
 <section id="rider"><div class="wrap"><div class="sh"><div><span class="mono">05 / Kebutuhan</span><h2>Rider</h2></div></div><h3 class="rh" style="margin-top:0">Technical rider</h3><div class="rid">
  <div><b>DJ Booth/Table:</b> 1 meja kokoh (tinggi minimal 90 cm), ruang untuk laptop dan kontroler (90 x 100), depan meja ditutup kain.</div>
  <div><b>Audio Output:</b> Panitia menyediakan kabel XLR (Male/Female) ke Main Mixer/Soundsystem. Operator sound siaga saat tampil.</div>
  <div><b>Power Supply:</b> Minimal 1 titik kontak listrik (terminal) di area DJ Booth.</div>
  <div><b>Microphone:</b> Minimal 1 mic wireless berkualitas layak untuk MC.</div></div>
  <h3 class="rh">Hospitality rider</h3><div class="rid">
  <div><b>Konsumsi:</b> Snack, air mineral (600 ml x 2) dan Pocari Sweat (2x) untuk DJ dan MC.</div>
  <div><b>Waiting Room:</b> Area tunggu layak (tertutup/ber-AC jika memungkinkan) sebelum jam tampil.</div>
  <div><b>Dalam Kota (Bandung/Bogor):</b> Bebas biaya transportasi atau sesuai kesepakatan.</div>
  <div><b>Luar Kota:</b> Transportasi (BBM/Tol) atau tiket PP dan penginapan ditanggung panitia.</div></div></div></section>
 <section id="contact"><div class="wrap"><div class="sh"><div><span class="mono">06 / Kontak</span><h2>Hubungi kami</h2><p class="sub">Cek tanggal event kamu sebelum penuh.</p></div></div>

 document.querySelectorAll(".wa").forEach(a=>{a.href=wa;a.target="_blank";a.rel="noopener"});
}
const lb=$("#lb"),showLb=()=>{lb.querySelector("img").src=lbList[lbI];lb.classList.add("on");lb.querySelectorAll(".pv,.nx").forEach(b=>b.style.display=lbList.length>1?"":"none")};
const step=d=>{lbI=(lbI+d+lbList.length)%lbList.length;showLb()};
lb.querySelector(".pv").onclick=e=>{e.stopPropagation();step(-1)};lb.querySelector(".nx").onclick=e=>{e.stopPropagation();step(1)};
lb.onclick=()=>lb.classList.remove("on");
addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="Escape")lb.classList.remove("on");if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-lb],[data-qr],[data-copy]");if(!t)return;
 if(t.dataset.lb){const[a,b]=t.dataset.lb.split(":");lbList=D.events[a].photos;lbI=+b;showLb()}
 else if(t.dataset.qr){lbList=[D.pay.qris];lbI=0;showLb()}
 else if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);toast("Nomor rekening disalin")}catch{toast(t.dataset.copy)}}
});
let BUSY=[];const bk=$("#bk"),rp=n=>"Rp"+n.toLocaleString("id-ID");
const fd=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const upd=()=>{const r=D.rates[+$("#bp").value],d=$("#bd").value;$("#bs").textContent=(r.amt?"Total "+rp(r.amt):"Harga disepakati via WhatsApp")+(d?" · bayar paling lambat "+fd(d)+" pukul 23.49 WIB":"");$("#be").textContent=BUSY.includes(d)?"Tanggal ini sudah dipesan, pilih tanggal lain.":""};
const openBk=i=>{$("#bp").innerHTML=D.rates.map((r,k)=>`<option value="${k}">${esc(r.name)} · ${esc(r.price)}</option>`).join("");$("#bp").value=i;$("#bd").min=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);$("#br").innerHTML="";$("#bgo").hidden=false;upd();bk.classList.add("on")};
document.addEventListener("click",e=>{const t=e.target.closest("[data-pick]");if(t){e.preventDefault();openBk(+t.dataset.pick)}});
$("#bx").onclick=()=>bk.classList.remove("on");$("#bp").onchange=$("#bd").onchange=upd;
$("#bgo").onclick=async()=>{const r=D.rates[+$("#bp").value],v=id=>$("#"+id).value.trim(),d=v("bd"),n=v("bn"),w=v("bw").replace(/\D/g,"").replace(/^0/,"62");
 if(!d||!n||w.length<9||!v("bl"))return $("#be").textContent="Lengkapi tanggal, nama, WhatsApp, dan lokasi.";
 if(BUSY.includes(d))return upd();
 $("#bgo").disabled=true;
 try{const res=await fetch("/api/booking",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({date:d,pkg:r.name,amt:r.amt||0,name:n,wa:w,place:v("bl"),note:v("bt")})}),j=await res.json();
  if(!res.ok)throw j.error;BUSY.push(d);$("#bgo").hidden=true;$("#be").textContent="";
  const m=`Halo DJ Tshake, saya ${n}. Pesanan ${j.id}: ${r.name}, ${fd(d)}, ${v("bl")}. Saya akan bayar paling lambat hari H pukul 23.49 WIB.`,Y=D.pay;
  $("#br").innerHTML=`<div class="fact"><h3>Pesanan ${j.id}</h3><p>Bayar paling lambat <b>${fd(d)} pukul 23.49 WIB</b>.${Y.no?` Transfer ${esc(Y.bank)} ${esc(Y.no)}${Y.name?" a.n. "+esc(Y.name):""}.`:""} Setelah bayar, kirim bukti lewat WhatsApp.</p></div>${Y.qris?`<img src="${esc(Y.qris)}" alt="QRIS" style="width:200px;background:#fff;padding:8px;border-radius:12px">`:""}<a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${D.profile.wa}?text=${encodeURIComponent(m)}">Konfirmasi via WhatsApp</a>`
 }catch(x){$("#be").textContent=typeof x=="string"?x:"Gagal memesan, coba lagi."}$("#bgo").disabled=false};
(async()=>{try{const r=await(await fetch("/api/data")).json();if(r.data)D={...D,...r.data};BUSY=r.busy||[]}catch{}render()})();
</script>
